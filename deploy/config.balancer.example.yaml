# A balancer: an agent on a host without algod. It routes clients to the
# fleet's nodes and is never an upstream itself. It registers like a node, so
# every node pushes its heartbeats to mesh.advertise.
role: balancer
mode: loadbalancer
listen: 0.0.0.0:4000
client_token_file: /etc/algod-loadb-mesh/client.token
admin_token_file: /etc/algod-loadb-mesh/admin.token   # no algod data dir to take the default from

local:
  id: lb1
  network: mainnet-v1.0               # genesis id of the fleet; required
  tags: [dc-a]

registry:
  type: algorand
  app_id: 0
  sync_key_file: /etc/algod-loadb-mesh/sync.key
  algod_url: http://10.112.0.44:8080  # any synced algod, for registry reads and self-registration; required
  algod_token: 0123456789abcdef...
  cache: /var/lib/algod-loadb-mesh/registry.cache

mesh:
  listen: [10.112.0.9:4001, 10.114.0.9:4001]      # one socket per mesh interface
  advertise: [10.112.0.9:4001, 10.114.0.9:4001]   # where nodes send heartbeats, preferred first; required

# Optional last resort when no node is eligible.
