// Installed by the algod-mesh package as
// /etc/apt/apt.conf.d/51algod-mesh-upgrades: lets unattended-upgrades
// install updates from apt.d13.co (this package, and dtalgorand if installed).
// Delete this file to upgrade by hand only (dpkg keeps it deleted).
Unattended-Upgrade::Origins-Pattern {
  "site=apt.d13.co,a=stable";
};
