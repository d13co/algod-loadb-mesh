# algod-loadb-mesh v2 agent configuration. One file per algod on the host.
mode: fallback                        # fallback | loadbalancer
listen: 0.0.0.0:4000                  # clients connect here
client_token_file: /etc/algod-loadb-mesh/client.token
log: { level: info, json: false }

local:
  id: k44                             # stable node name; default: hostname
  data_dir: /var/lib/algorand         # algod.net, algod.token, genesis.json, config.json
  advertise_endpoints:                # how *other agents* reach this algod (WireGuard IPs)
    - http://10.112.0.44:8080
  tier: 1
  tags: [dc-a]
  # overrides: { archival: { kind: since, n: 25000000 }, developer_api: true }

registry:
  type: algorand                      # algorand | file | memory | static
  app_id: 0                           # from `algod-loadb-mesh registry init`
  sync_key_file: /etc/algod-loadb-mesh/sync.key   # 25-word mnemonic of the sync account
  # sync_address: ABC...                 # only if the sync account is rekeyed: the account; sync_key is its auth key
  # algod_url / algod_token: leave empty to use the local node
  refresh: 5m
  auto_register: true
  cache: /var/lib/algod-loadb-mesh/registry.cache

mesh:
  listen: 0.0.0.0:4001                # UDP heartbeats in
  advertise: 10.112.0.44:4001         # what peers send heartbeats to
  suspect_after: 10s
  down_after: 30s
  probe_interval: 10s
  keepalive: 5s
  # peer_overrides: { bambi: { tier: 2 } }

tiers:
  external:
    - name: nodely
      url: https://mainnet-api.4160.nodely.dev
      tier: 100
      capabilities: { archival: { kind: full } }
      health_check: 60s

routing:
  sync_tolerance: 0
  lag_grace: 1500ms                   # one round behind counts as lagging only after this long
  return_hysteresis_rounds: 3
  multi_broadcast: false
  retry_budget: 1
  upstream_timeout: 60s
  pending_ttl: 60s
  drain_timeout: 10s
  breaker: { threshold: 5, open_for: 10s }
